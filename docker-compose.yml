# Django REST Framework 로컬 개발용 compose 설정.
#
# 이 파일은 백엔드 소스 코드를 컨테이너의 /app에 마운트해서
# 로컬 코드 변경이 Django 개발 서버에 바로 반영되도록 합니다.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: run
    container_name: drf-backend-dev
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      # 로컬 backend 코드를 컨테이너 /app에 연결해서 코드 변경을 즉시 반영합니다.
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: "config.settings"
      DJANGO_DEBUG: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    # Django runserver는 기본적으로 코드 변경을 감지해 자동 reload합니다.
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

